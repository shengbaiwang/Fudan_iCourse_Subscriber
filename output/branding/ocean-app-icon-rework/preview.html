<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCourse · 海洋图标</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae8e4;color:#172238;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;padding:48px 40px}
header{margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:3px;color:#6c7480}
h1{font-size:25px;font-weight:550;letter-spacing:-.5px;margin:12px 0 0}
.layout{display:grid;grid-template-columns:320px 1fr;gap:26px}
.hero{background:#f5f4f1;display:flex;align-items:center;justify-content:center;border-radius:20px;padding:36px}
.hero img{width:248px;height:248px;border-radius:55px;display:block}
.sizes{display:grid;grid-template-rows:1fr 1fr;gap:20px}
.surface{border-radius:20px;padding:22px 26px}.light{background:#f5f4f1}.dark{background:#171d29;color:#d7dce6}
.caption{font-size:11px;letter-spacing:1px;opacity:.55;margin-bottom:14px}
.row{display:flex;align-items:flex-end;gap:26px}
.app{display:flex;align-items:center;flex-direction:column;gap:8px}
.app img{display:block;width:64px;height:64px;border-radius:14px}
.app.small img{width:32px;height:32px;border-radius:7px}
.app span{font-size:10px;opacity:.8}
.placeholder{height:64px;width:64px;border-radius:14px;background:#d8d8d6;display:flex;align-items:center;justify-content:center;color:#8d959b}
.dark .placeholder{background:#2d3543;color:#758398}
.placeholder .square{width:24px;height:28px;border:2px solid currentColor;border-radius:4px}
.placeholder .circle{width:27px;height:27px;border:2px solid currentColor;border-radius:50%}
footer{margin-top:24px;font-size:12px;color:#677180;display:flex;justify-content:space-between;gap:15px}
a{color:inherit;text-decoration:none;border-bottom:1px solid #a4a9b0}
@media(max-width:650px){main{padding:28px 20px}.layout{grid-template-columns:1fr}.hero{padding:28px}.hero img{width:220px;height:220px;border-radius:49px}.row{gap:20px}footer{flex-wrap:wrap}}
</style>
<main><header><div class="eyebrow">iCOURSE / APP ICON</div><h1>三角形 · 海洋</h1></header>
<section class="layout">
<div class="hero"><img src="icon.png" alt="深蓝背景上，由三角形和浪的曲线组成的 iCourse 图标"></div>
<div class="sizes">
<div class="surface light"><div class="caption">浅色桌面 / 64 PX · 32 PX</div><div class="row">
<div class="app"><div class="placeholder"><i class="square"></i></div><span>资料</span></div>
<div class="app"><img src="icon.png" alt="64 像素 iCourse 图标"><span>iCourse</span></div>
<div class="app"><div class="placeholder"><i class="circle"></i></div><span>记录</span></div>
<div class="app small"><img src="icon.png" alt="32 像素 iCourse 图标"><span>32 px</span></div>
</div></div>
<div class="surface dark"><div class="caption">深色桌面 / 64 PX · 32 PX</div><div class="row">
<div class="app"><div class="placeholder"><i class="square"></i></div><span>资料</span></div>
<div class="app"><img src="icon.png" alt="64 像素 iCourse 图标"><span>iCourse</span></div>
<div class="app"><div class="placeholder"><i class="circle"></i></div><span>记录</span></div>
<div class="app small"><img src="icon.png" alt="32 像素 iCourse 图标"><span>32 px</span></div>
</div></div>
</div></section>
<footer><span>圆角遮罩与实际尺寸预览</span><span><a href="icon.png" download="icourse-ocean-icon.png">下载图标</a> · <a href="prompt.md">生成提示词</a></span></footer>
</main></html>
