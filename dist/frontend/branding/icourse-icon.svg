<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">iCourse — 秩序成为海浪</title>
  <desc id="desc">午夜蓝背景上的圆润三角形。三层蓝色从整齐的水平排列向右上涌，成为海浪。</desc>
